name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff detect-secrets
      - run: ruff check . --no-cache --select E9,F63,F7,F82
      - run: python -m unittest discover -s tests -v
      - run: python -m market_intelligence.cli asking-prices examples/asking-prices.synthetic.json
      - run: python -m market_intelligence.cli prices examples/price-predictions.synthetic.json
      - run: python -m market_intelligence.cli matching examples/matching-predictions.synthetic.json
      - name: Scan tracked files and Git history
        run: |
          detect-secrets scan --all-files > /tmp/secret-scan.json
          python scripts/check_secret_scan.py /tmp/secret-scan.json
          mkdir -p /tmp/history-scan
          git log --format=%H | while read -r commit; do
            git archive "$commit" | tar -x -C /tmp/history-scan
            (cd /tmp/history-scan && detect-secrets scan --all-files > /tmp/history-secrets.json)
            python scripts/check_secret_scan.py /tmp/history-secrets.json
            rm -rf /tmp/history-scan && mkdir /tmp/history-scan
          done
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
