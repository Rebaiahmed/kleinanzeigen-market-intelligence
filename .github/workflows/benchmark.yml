name: Demonstrate offline metrics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fictional examples (not model benchmark results)
        run: |
          python -m market_intelligence.cli prices examples/price-predictions.synthetic.json
          python -m market_intelligence.cli matching examples/matching-predictions.synthetic.json
